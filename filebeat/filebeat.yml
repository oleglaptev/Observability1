filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container: {}
    prospector.scanner.symlinks: true

processors:
  # JSON из message → отдельные поля корня документа
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

  # Оставляем только наши структурированные логи api и worker
  - drop_event:
      when:
        not:
          or:
            - equals:
                service: "api"
            - equals:
                service: "worker"

  - drop_fields:
      fields: ["agent", "ecs", "input", "host"]
      ignore_missing: true

output.logstash:
  hosts: ["logstash:5044"]

setup.ilm.enabled: false
setup.template.enabled: false
setup.dashboards.enabled: false

logging.level: info
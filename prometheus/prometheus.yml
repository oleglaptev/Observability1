global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: 'http://victoria_metrics:8428/api/v1/write'

scrape_configs:
  # API
  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']

  # Worker
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9101']

  # Custom Exporter
  - job_name: 'custom_exporter'
    static_configs:
      - targets: ['custom_exporter:9102']

  # Хост
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # Контейнеры
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL
  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']

  # RabbitMQ (встроенный Prometheus-плагин)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
input {
  beats {
    port => 5044
    ecs_compatibility => disabled
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      ecs_compatibility => disabled
    }
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
    manage_template => false
    ecs_compatibility => disabled
  }
}